<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Your Fav Person 💫</Muhammad Ligar>
    <style>
        /* === FONT: pakai system font biar pasti jalan di HP === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            padding: 10px 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* === WELCOME SCREEN === */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: linear-gradient(135deg, #91856e 0%, #60390f 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            padding: 20px;
            text-align: center;
        }

        .welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .welcome-heart {
            font-size: 70px;
            margin-bottom: 20px;
            animation: welcomePulse 1.5s ease infinite;
            display: block;
        }

        .welcome-text {
            font-size: 32px;
            color: #ffffff;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: welcomeFadeIn 1s ease forwards;
            line-height: 1.3;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .welcome-sub {
            font-size: 15px;
            color: rgba(255,255,255,0.9);
            margin-top: 15px;
            text-align: center;
            opacity: 0;
            animation: welcomeFadeIn 1s ease 0.5s forwards;
            max-width: 90%;
            font-weight: 400;
        }

        .enter-btn {
            margin-top: 40px;
            padding: 16px 40px;
            background: #54472b;
            color: #555439;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.8);
            animation: welcomeFadeIn 1s ease 1s forwards, btnPulse 2s ease infinite 2s;
            transition: transform 0.2s;
            white-space: nowrap;
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        @keyframes welcomeFadeIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes welcomePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
            50% { box-shadow: 0 0 0 15px rgba(255,255,255,0); }
        }

        /* === MAIN CONTENT === */
        .main-content {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 12px;
            opacity: 0;
            animation: mainFadeIn 1s ease 0.3s forwards;
        }

        .main-content.visible {
            display: block;
        }

        @keyframes mainFadeIn {
            to { opacity: 1; }
        }

        .card {
            background: #a26945;
            border-radius: 24px;
            padding: 28px 18px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            animation: cardFloatIn 1s ease-out;
            width: 100%;
        }

        @keyframes cardFloatIn {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .heart {
            font-size: 55px;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
            margin-bottom: 10px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1.2); }
            75% { transform: scale(1.1); }
        }

        h1 {
            color: #764ba2;
            font-size: 26px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .subtitle {
            color: #888888;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .message-box {
            background: linear-gradient(135deg, #eeeceb 0%, #312c28 100%);
            border-radius: 16px;
            padding: 18px 15px;
            margin: 14px 0;
            text-align: left;
            position: relative;
            border-left: 4px solid #c4a484;
            width: 100%;
        }

        .message-box::after {
            content: '✨';
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 16px;
            opacity: 0.4;
            animation: sparkleRotate 3s linear infinite;
        }

        @keyframes sparkleRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message-text {
            color: #4a3728;
            font-size: 14px;
            line-height: 1.85;
            opacity: 0;
            animation: fadeIn 1s forwards;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message-text + .message-text {
            margin-top: 12px;
        }

        .message-text:nth-child(1) { animation-delay: 0.3s; }
        .message-text:nth-child(2) { animation-delay: 1s; }
        .message-text:nth-child(3) { animation-delay: 1.7s; }
        .message-text:nth-child(4) { animation-delay: 2.4s; }
        .message-text:nth-child(5) { animation-delay: 3.1s; }
        .message-text:nth-child(6) { animation-delay: 3.8s; }
        .message-text:nth-child(7) { animation-delay: 4.5s; }
        .message-text:nth-child(8) { animation-delay: 5.2s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .highlight {
            color: #8b6914;
            font-weight: 700;
        }

        .support-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #c4a484, #daa06d);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 16px;
            cursor: pointer;
            border: none;
            animation: fadeIn 1s 5.5s forwards;
            opacity: 0;
            white-space: nowrap;
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
            transition: transform 0.2s;
        }

        .support-badge:active {
            transform: scale(0.95);
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            color: rgba(255,255,255,0.2);
            font-size: 18px;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            from {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            to {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .signature {
            margin-top: 18px;
            color: #999999;
            font-size: 12px;
            font-style: italic;
            animation: fadeIn 1s 6s forwards;
            opacity: 0;
            word-wrap: break-word;
        }

        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #daa06d;
            border-radius: 50%;
            animation: sparkleAnim 2s infinite;
        }

        @keyframes sparkleAnim {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px #daa06d; }
        }

        /* === RESPONSE SECTION === */
        .response-section {
            margin-top: 18px;
            display: none;
            animation: slideDown 0.5s ease-out;
            width: 100%;
        }

        .response-section.active {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .response-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 25px;
            border: 2px solid #c4a484;
            background: #ffffff;
            color: #8b6914;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            white-space: nowrap;
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.95);
            background: #c4a484;
            color: #ffffff;
        }

        .encouragement-response {
            margin-top: 12px;
            padding: 14px;
            background: linear-gradient(135deg, #f8f5f2, #f0e8e0);
            border-radius: 14px;
            color: #4a3728;
            font-weight: 700;
            display: none;
            animation: popIn 0.5s ease-out;
            border-left: 3px solid #c4a484;
            text-align: left;
            line-height: 1.7;
            font-size: 13px;
            word-wrap: break-word;
        }

        .encouragement-response.show {
            display: block;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* === SCROLLBAR === */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(196, 164, 132, 0.4);
            border-radius: 10px;
        }

        /* === iOS SAFE AREA === */
        @supports (padding-top: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>
    <!-- WELCOME SCREEN -->
    <div class="welcome-screen" id="welcomeScreen">
        <span class="welcome-heart">🤎</span>
        <div class="welcome-text">Welcome My Fav Person</div>
        <div class="welcome-sub">Ada sesuatu spesial untukmu di dalam...</div>
        <button class="enter-btn" onclick="enterMain()">✨ Buka Suratnya ✨</button>
    </div>

    <!-- FLOATING HEARTS -->
    <div class="floating-hearts" id="heartsContainer"></div>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
        <div class="card">
            <div class="sparkle" style="top: 18px; left: 28px; animation-delay: 0s;"></div>
            <div class="sparkle" style="top: 50px; right: 35px; animation-delay: 0.7s;"></div>
            <div class="sparkle" style="bottom: 70px; left: 18px; animation-delay: 1.4s;"></div>

            <div class="heart">🤎</div>
            <h1>Hai, Sayangggg!</h1>
            <p class="subtitle">Pesan kecil dari aku untukmu ✨</p>

            <div class="message-box">
                <p class="message-text">Sayang, aku tahu kerja itu <span class="highlight">melelahkan</span>. Capek itu wajar, bukan kelemahan. Jangan pernah merasa bersalah karena tubuhmu butuh istirahat karena kamu manusia, bukan mesin yang bisa terus berjalan tanpa henti.</p>

                <p class="message-text"><span class="highlight">Jaga kesehatanmu</span>, ya? Makan yang teratur, tidur yang cukup, minum air yang banyak. Ingat aku nggak ngelarang kamu minum manis, tapi aku mau kamu kurangin. Jaga makan itu penting, bukan sekadar isi perut, tapi juga isi semangatmu untuk esok hari. Jangan terlalu sering begadang.</p>

                <p class="message-text">Aku selalu <span class="highlight">menunggu</span> nunggu kabar bahwa kamu bahagia. Itu saja sudah cukup buatku tenang. Aku ingin melihatmu tersenyum, meski dari kejauhan, meski dari cerita orang lain.</p>

                <p class="message-text">Dan satu hal lagi yang ingin kusampaikan dengan tulus: <span class="highlight">kamu tak perlu merasa sungkan</span> untuk mengeluh, untuk bercerita. Aku ada sebagai seseorang yang masih peduli.</p>

                <p class="message-text"><span class="highlight">Semangat terus, sayang.</span> Dunia ini keras, tapi hatimu lebih keras lagi. Aku percaya kamu bisa. 💪✨</p>

                <p class="message-text"><span class="highlight">Sayang, aku seneng kenal kamu.</span> Maaf untuk hal yang sering bikin capek kamu dengan semua pertanyaanku.</p>

                <p class="message-text"><span class="highlight">Terima kasih bahwa bahagia itu bisa sekecil senyummu di ujung telepon,</span> sekecil nama yang muncul di layar, sekecil "udah makan?" yang ternyata adalah cara paling manusiawi untuk mengatakan aku peduli.</p>

                <p class="message-text"><span class="highlight">Aku mungkin bukan pemberi terbaik yang pernah kamu temui,</span> tapi semoga kamu selalu ingat baiknya aku, bukan kurangnya yang ada pada diriku. Saat kamu hadir, apa yang aku katakan mungkin hanya kata kecil, tapi aku harap kamu bisa bahagia dengan pesan-pesan kecil ini. 💗</p>
            </div>

            <button class="support-badge" onclick="showResponse()">
                💌 Note semangat nih, pilih sayang 🥰
            </button>

            <div class="response-section" id="responseSection">
                <p style="color: #666; font-size: 13px;">Pilih semangat yang kamu butuhkan:</p>
                <div class="response-buttons">
                    <button class="btn" onclick="showEncouragement('kerja')">💼 Kerja</button>
                    <button class="btn" onclick="showEncouragement('hidup')">🌱 Hidup</button>
                    <button class="btn" onclick="showEncouragement('cinta')">💕 Cinta</button>
                </div>
                <div class="encouragement-response" id="encouragementResponse"></div>
            </div>

            <p class="signature">— Dari seseorang yang masih peduli ~zee~ 💫</p>
        </div>
    </div>

    <script>
        function enterMain() {
            const welcome = document.getElementById('welcomeScreen');
            const main = document.getElementById('mainContent');

            welcome.classList.add('hidden');
            main.classList.add('visible');

            document.body.style.overflowY = 'auto';
            document.body.style.height = 'auto';
            document.body.style.minHeight = '100vh';
            document.body.style.minHeight = '100dvh';

            setTimeout(() => {
                createHearts();
            }, 400);
        }

        function createHearts() {
            const container = document.getElementById('heartsContainer');
            const hearts = ['🤎', '💜', '✨', '💫', '🌟', '💖', '💗'];

            for (let i = 0; i < 5; i++) {
                setTimeout(() => createHeart(container, hearts), i * 200);
            }

            setInterval(() => {
                createHeart(container, hearts);
            }, 800);
        }

        function createHeart(container, hearts) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
            heart.style.fontSize = (Math.random() * 12 + 14) + 'px';
            container.appendChild(heart);

            setTimeout(() => {
                if (heart.parentNode) heart.remove();
            }, 10000);
        }

        function showResponse() {
            const section = document.getElementById('responseSection');
            section.classList.add('active');
            setTimeout(() => {
                section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function showEncouragement(type) {
            const responses = {
                kerja: "🔥 Kerjaan bisa menumpuk, wajar istirahat kalau butuh, tapi jangan menyerah. Jaga kesehatan dan makan yang teratur, ya? Kamu hebat! 💼✨",
                hidup: "🌈 Hidup memang nggak mudah, tapi kamu sudah berhasil melewati hari-hari sulit sebelumnya. Aku yakin kamu bisa lagi. Jaga kesehatan, jaga makan, dan ingat — kamu nggak sendirian. Kuat! 💪",
                cinta: "💝 Hatimu berharga. Jangan biarkan siapapun membuatmu merasa kurang. Kamu layak dicintai dengan tulus dan dijaga dengan sayang. Tetap percaya pada kebaikan! 💕"
            };

            const responseDiv = document.getElementById('encouragementResponse');
            responseDiv.textContent = responses[type];
            responseDiv.classList.add('show');
        }

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
